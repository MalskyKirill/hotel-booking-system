server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        -   id: booking-openapi
                            uri: lb://booking-service
                            predicates:
                                - Path=/v3/api-docs/booking
                            filters:
                                - SetPath=/v3/api-docs

                        -   id: hotel-openapi
                            uri: lb://hotel-service
                            predicates:
                                - Path=/v3/api-docs/hotel
                            filters:
                                - SetPath=/v3/api-docs

                        -   id: admin-hotel-route
                            uri: lb://hotel-service
                            predicates:
                                - Path=/api/admin/rooms/**

                        -   id: admin-users-route
                            uri: lb://booking-service
                            predicates:
                                - Path=/api/admin/users/**

                        -   id: hotel-route
                            uri: lb://hotel-service
                            predicates:
                                - Path=/api/hotels/**

                        -   id: room-route
                            uri: lb://hotel-service
                            predicates:
                                - Path=/api/rooms/**

                        -   id: auth-route
                            uri: lb://booking-service
                            predicates:
                                - Path=/api/auth/**

                        -   id: booking-route
                            uri: lb://booking-service
                            predicates:
                                - Path=/api/bookings/**



eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoint:
        gateway:
            access: read-only
    endpoints:
        web:
            exposure:
                include: gateway

springdoc:
    paths-to-match: /api/**
    api-docs:
        version: OPENAPI_3_0
    swagger-ui:
        disable-swagger-default-url: true
        urls:
            - name: Booking Service
              url: /v3/api-docs/booking
            - name: Hotel Service
              url: /v3/api-docs/hotel

logging:
    structured:
        format:
            console: ecs
