server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webmvc:
                    routes:
                        - id: hotel-route
                          uri: lb://hotel-service
                          predicates:
                              - Path=/api/hotels/**


eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/

management:
    endpoint:
        gateway:
            access: read-only
    endpoints:
        web:
            exposure:
                include: gateway
